<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; text-align:center; padding:2rem;">
  <h2>PWA Icon Generator</h2>
  <canvas id="c" style="display:none;"></canvas>
  <button onclick="downloadIcon(192)" style="padding:10px 16px; margin:8px; font-size:16px;">Download icon-192.png</button><br>
  <button onclick="downloadIcon(512)" style="padding:10px 16px; margin:8px; font-size:16px;">Download icon-512.png</button>

  <script>
    function downloadIcon(size) {
      const c = document.getElementById('c');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');

      // Indigo background
      ctx.fillStyle = '#312e81';
      ctx.fillRect(0, 0, size, size);

      // Icon symbol
      ctx.fillStyle = '#6ee7b7';
      ctx.font = `bold ${Math.floor(size * 0.45)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏛️', size / 2, size / 2);

      const a = document.createElement('a');
      a.download = `icon-${size}.png`;
      a.href = c.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
